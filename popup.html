<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Downloader Pro</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="icons/icon48.png" alt="Logo" class="logo" id="header-logo">
            <h1>Downloader Pro</h1>
        </div>
        <div class="header-actions">
            <button id="clear-btn" class="icon-btn" title="Clear all media">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
            </button>
            <button id="refresh-btn" class="icon-btn" title="Force refresh media">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
            </button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="videos">Videos (<span id="video-count">0</span>)</button>
        <button class="tab-btn" data-tab="images">Images (<span id="image-count">0</span>)</button>
        <button class="tab-btn" data-tab="docs">Docs (<span id="doc-count">0</span>)</button>
    </div>

    <div class="content" id="videos-tab">
        <div class="manual-add-section">
            <input type="text" id="manual-link-input" placeholder="Paste any video / page link...">
            <button id="manual-add-btn">Detect</button>
        </div>
        <ul id="video-list" class="media-list">
            <li class="empty-state">No videos detected yet. Play a video to detect it.</li>
        </ul>
    </div>

    <div class="content hidden" id="images-tab">
        <ul id="image-list" class="media-list">
            <li class="empty-state">No images detected.</li>
        </ul>
    </div>

    <div class="content hidden" id="docs-tab">
        <ul id="doc-list" class="media-list">
            <li class="empty-state">No documents detected.</li>
        </ul>
    </div>

    <script src="popup.js"></script>
</body>
</html>
